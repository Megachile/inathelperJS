<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Filters URL Generator</title>
    <link rel="stylesheet" href="URLgen.css">
</head>
<body>
    <fieldset>
        <legend>Select Filters for iNaturalist Identify Page</legend>
        <fieldset id="tooltip-toggle">
          <label class="switch">
              <input type="checkbox" id="tooltipToggle">
              <span class="slider round"></span>
          </label>
          <span>Enable Tooltips</span>
        </fieldset>
        <fieldset>
          <button id="resetButton" type="button">Reset All Inputs</button>
        </fieldset>        
        <fieldset>
            <legend>Quality Grade</legend>
            <label><input type="checkbox" name="quality_grade" value="casual" checked> Casual</label>
            <label><input type="checkbox" name="quality_grade" value="needs_id" checked> Needs ID</label>
            <label><input type="checkbox" name="quality_grade" value="research" checked> Research Grade</label>
        </fieldset>
        
        <fieldset>
            <legend>Reviewed Status</legend>
            <label><input type="radio" name="reviewed" value="any" checked> Any</label>
            <label><input type="radio" name="reviewed" value="true"> Yes</label>
            <label><input type="radio" name="reviewed" value="false"> No</label>
        </fieldset>

        <div class="collapsible-container">
          <button id="toggleCategories" class="collapse-toggle">Taxon Categories ▼</button>
          <fieldset id="categoriesFieldset" class="collapsed">
            <div class="categories-grid">
              <div class="category-item">
                <input type="checkbox" id="category-Aves" name="categories" value="Aves">
                <label for="category-Aves">Birds</label>
              </div>
              <div class="category-item">
                <input type="checkbox" id="category-Amphibia" name="categories" value="Amphibia">
                <label for="category-Amphibia">Amphibians</label>
              </div>
              <div class="category-item">
                <input type="checkbox" id="category-Reptilia" name="categories" value="Reptilia">
                <label for="category-Reptilia">Reptiles</label>
              </div>
              <div class="category-item">
                <input type="checkbox" id="category-Mammalia" name="categories" value="Mammalia">
                <label for="category-Mammalia">Mammals</label>
              </div>
              <div class="category-item">
                <input type="checkbox" id="category-Actinopterygii" name="categories" value="Actinopterygii">
                <label for="category-Actinopterygii">Ray-finned Fishes</label>
              </div>
              <div class="category-item">
                <input type="checkbox" id="category-Mollusca" name="categories" value="Mollusca">
                <label for="category-Mollusca">Mollusks</label>
              </div>
              <div class="category-item">
                <input type="checkbox" id="category-Arachnida" name="categories" value="Arachnida">
                <label for="category-Arachnida">Arachnids</label>
              </div>
              <div class="category-item">
                <input type="checkbox" id="category-Insecta" name="categories" value="Insecta">
                <label for="category-Insecta">Insects</label>
              </div>
              <div class="category-item">
                <input type="checkbox" id="category-Plantae" name="categories" value="Plantae">
                <label for="category-Plantae">Plants</label>
              </div>
              <div class="category-item">
                <input type="checkbox" id="category-Fungi" name="categories" value="Fungi">
                <label for="category-Fungi">Fungi</label>
              </div>
              <div class="category-item">
                <input type="checkbox" id="category-Protozoa" name="categories" value="Protozoa">
                <label for="category-Protozoa">Protozoans</label>
              </div>
              <div class="category-item">
                <input type="checkbox" id="category-unknown" name="categories" value="unknown">
                <label for="category-unknown" data-tooltip="Unknown (Includes Bacteria, Archaea, Viruses, and Life)">Unknown</label>
            </div>
            </div>
          </fieldset>
        </div>
  
        <div class="collapsible-container">
          <button id="toggleSortingRanking" class="collapse-toggle">Sorting and Ranking ▼</button>
          <fieldset id="sortingRankingFieldset" class="collapsed">
          <div>
            <label for="sortBy">Sort By:</label>
            <select id="sortBy">
              <option value="created_at">Date Added</option>
              <option value="observed_on">Date Observed</option>
              <option value="updated_at">Date Updated</option>
              <option value="votes">Faves</option>
              <option value="random">Random</option>
            </select>
          </div>

          <div>
            <label for="sortOrder">Order:</label>
            <select id="sortOrder">
              <option value="desc">Descending</option>
              <option value="asc">Ascending</option>
            </select>
          </div>

          <div>
            <label for="rankHigh">Rank (High):</label>
            <select id="rankHigh">
                    <option value="">Any</option>
                    <option value="kingdom">Kingdom</option>
                    <option value="phylum">Phylum</option>
                    <option value="subphylum">Subphylum</option>
                    <option value="superclass">Superclass</option>
                    <option value="class">Class</option>
                    <option value="subclass">Subclass</option>
                    <option value="infraclass">Infraclass</option>
                    <option value="subterclass">Subterclass</option>
                    <option value="superorder">Superorder</option>
                    <option value="order">Order</option>
                    <option value="suborder">Suborder</option>
                    <option value="infraorder">Infraorder</option>
                    <option value="parvorder">Parvorder</option>
                    <option value="zoosection">Zoosection</option>
                    <option value="zoosubsection">Zoosubsection</option>
                    <option value="superfamily">Superfamily</option>
                    <option value="epifamily">Epifamily</option>
                    <option value="family">Family</option>
                    <option value="subfamily">Subfamily</option>
                    <option value="supertribe">Supertribe</option>
                    <option value="tribe">Tribe</option>
                    <option value="subtribe">Subtribe</option>
                    <option value="genus">Genus</option>
                    <option value="genushybrid">Genus hybrid</option>
                    <option value="subgenus">Subgenus</option>
                    <option value="section">Section</option>
                    <option value="subsection">Subsection</option>
                    <option value="complex">Complex</option>
                    <option value="species">Species</option>
                    <option value="hybrid">Hybrid</option>
                    <option value="subspecies">Subspecies</option>
                    <option value="variety">Variety</option>
                    <option value="form">Form</option>
                    <option value="infrahybrid">Infrahybrid</option>
                  </select>
          </div>

          <div>
            <label for="rankLow">Rank (Low):</label>
            <select id="rankLow">
                <option value="">Any</option>
                <option value="kingdom">Kingdom</option>
                <option value="phylum">Phylum</option>
                <option value="subphylum">Subphylum</option>
                <option value="superclass">Superclass</option>
                <option value="class">Class</option>
                <option value="subclass">Subclass</option>
                <option value="infraclass">Infraclass</option>
                <option value="subterclass">Subterclass</option>
                <option value="superorder">Superorder</option>
                <option value="order">Order</option>
                <option value="suborder">Suborder</option>
                <option value="infraorder">Infraorder</option>
                <option value="parvorder">Parvorder</option>
                <option value="zoosection">Zoosection</option>
                <option value="zoosubsection">Zoosubsection</option>
                <option value="superfamily">Superfamily</option>
                <option value="epifamily">Epifamily</option>
                <option value="family">Family</option>
                <option value="subfamily">Subfamily</option>
                <option value="supertribe">Supertribe</option>
                <option value="tribe">Tribe</option>
                <option value="subtribe">Subtribe</option>
                <option value="genus">Genus</option>
                <option value="genushybrid">Genus hybrid</option>
                <option value="subgenus">Subgenus</option>
                <option value="section">Section</option>
                <option value="subsection">Subsection</option>
                <option value="complex">Complex</option>
                <option value="species">Species</option>
                <option value="hybrid">Hybrid</option>
                <option value="subspecies">Subspecies</option>
                <option value="variety">Variety</option>
                <option value="form">Form</option>
                <option value="infrahybrid">Infrahybrid</option>
              </select>
          </div>

          <div>
            <label for="perPage">Results per page: (max 200)</label>
            <input type="number" id="perPage" min="1" max="200" value="30">
          </div>
        </fieldset>
        </div>

        <div class="collapsible-container">
            <button id="toggleAdditionalParams" class="collapse-toggle">Additional Search Parameters ▼</button>
            <fieldset id="additionalParams" class="collapsed">    
              <div id="customListSelector">
                <label>Select Custom Lists:</label>
                <div id="customListsContainer">
                  <!-- Checkboxes will be populated dynamically -->
                </div>
              </div>  
              <div>
                <label for="listIdInput" data-tooltip="Restrict search to taxa in a specific iNaturalist list">List ID:</label>
                <input type="text" id="listIdInput" placeholder="Enter List ID">
              </div>
          
              <div>
                <label for="descriptionTagInput">Description/Tag Search:</label>
                <input type="text" id="descriptionTagInput" placeholder="Enter search term">
                <div>
                    <label>Search on:</label>
                    <label><input type="radio" name="searchOn" value="all" checked> All</label>
                    <label><input type="radio" name="searchOn" value="description"> Description</label>
                    <label><input type="radio" name="searchOn" value="tags"> Tags</label>
                    <label><input type="radio" name="searchOn" value="names"> Active ID Taxon Names</label>
                    <label><input type="radio" name="searchOn" value="place"> Place Description</label>
                </div>
            </div>
          
              <div>
                <label for="accountAgeMin" data-tooltip="Include only observations from users with accounts created more than this many weeks ago">Account Age (min weeks)</label>
                <input type="number" id="accountAgeMin" min="0">
              </div>
          
              <div>
                <label for="accountAgeMax" data-tooltip="Include only observations from users with accounts created fewer than this many weeks ago">Account Age (max weeks)</label>
                <input type="number" id="accountAgeMax" min="0">
              </div>
          
              <div>
                <label>Photo Licenses:</label>
                <div id="photoLicenses">
                  <label><input type="checkbox" name="photo_license" value="cc0"> CC0</label>
                  <label><input type="checkbox" name="photo_license" value="cc-by"> CC-BY</label>
                  <label><input type="checkbox" name="photo_license" value="cc-by-sa"> CC-BY-SA</label>
                  <label><input type="checkbox" name="photo_license" value="cc-by-nc"> CC-BY-NC</label>
                  <label><input type="checkbox" name="photo_license" value="cc-by-nd"> CC-BY-ND</label>
                  <label><input type="checkbox" name="photo_license" value="cc-by-nc-sa"> CC-BY-NC-SA</label>
                  <label><input type="checkbox" name="photo_license" value="cc-by-nc-nd"> CC-BY-NC-ND</label>
                  <label><input type="checkbox" id="allRightsReserved" name="photo_licensed" value="false"> All rights reserved</label>
                </div>
              </div>
          
              <div>
                <label>Sound Licenses:</label>
                <div id="soundLicenses">
                  <label><input type="checkbox" name="sound_license" value="cc0"> CC0</label>
                  <label><input type="checkbox" name="sound_license" value="cc-by"> CC-BY</label>
                  <label><input type="checkbox" name="sound_license" value="cc-by-sa"> CC-BY-SA</label>
                  <label><input type="checkbox" name="sound_license" value="cc-by-nc"> CC-BY-NC</label>
                  <label><input type="checkbox" name="sound_license" value="cc-by-nd"> CC-BY-ND</label>
                  <label><input type="checkbox" name="sound_license" value="cc-by-nc-sa"> CC-BY-NC-SA</label>
                  <label><input type="checkbox" name="sound_license" value="cc-by-nc-nd"> CC-BY-NC-ND</label>
                </div>
              </div>       
              
              <div>
                <label>Observation Sources:</label>
                <div id="observationSources">
                  <label><input type="checkbox" value="any" checked> Any</label>
                  <label><input type="checkbox" value="2"> iNaturalist Android app</label>
                  <label><input type="checkbox" value="3"> iNaturalist iOS app</label>
                  <label><input type="checkbox" value="333"> Seek app</label>
                </div>
              </div>

              <p class="filter-subhead">Taxon &amp; Status</p>
              <div>
                <label data-tooltip="Taxon must be exactly one of these ranks. Independent of the Rank High/Low range under Sorting &amp; Ranking; setting both narrows to their overlap.">Exact Rank(s):</label>
                <div id="rankFilter" class="checkbox-grid">
                  <label><input type="checkbox" id="rankFilter-stateofmatter" name="rank" value="stateofmatter"> Stateofmatter</label>
                  <label><input type="checkbox" id="rankFilter-kingdom" name="rank" value="kingdom"> Kingdom</label>
                  <label><input type="checkbox" id="rankFilter-phylum" name="rank" value="phylum"> Phylum</label>
                  <label><input type="checkbox" id="rankFilter-subphylum" name="rank" value="subphylum"> Subphylum</label>
                  <label><input type="checkbox" id="rankFilter-superclass" name="rank" value="superclass"> Superclass</label>
                  <label><input type="checkbox" id="rankFilter-class" name="rank" value="class"> Class</label>
                  <label><input type="checkbox" id="rankFilter-subclass" name="rank" value="subclass"> Subclass</label>
                  <label><input type="checkbox" id="rankFilter-superorder" name="rank" value="superorder"> Superorder</label>
                  <label><input type="checkbox" id="rankFilter-order" name="rank" value="order"> Order</label>
                  <label><input type="checkbox" id="rankFilter-suborder" name="rank" value="suborder"> Suborder</label>
                  <label><input type="checkbox" id="rankFilter-infraorder" name="rank" value="infraorder"> Infraorder</label>
                  <label><input type="checkbox" id="rankFilter-superfamily" name="rank" value="superfamily"> Superfamily</label>
                  <label><input type="checkbox" id="rankFilter-epifamily" name="rank" value="epifamily"> Epifamily</label>
                  <label><input type="checkbox" id="rankFilter-family" name="rank" value="family"> Family</label>
                  <label><input type="checkbox" id="rankFilter-subfamily" name="rank" value="subfamily"> Subfamily</label>
                  <label><input type="checkbox" id="rankFilter-supertribe" name="rank" value="supertribe"> Supertribe</label>
                  <label><input type="checkbox" id="rankFilter-tribe" name="rank" value="tribe"> Tribe</label>
                  <label><input type="checkbox" id="rankFilter-subtribe" name="rank" value="subtribe"> Subtribe</label>
                  <label><input type="checkbox" id="rankFilter-genus" name="rank" value="genus"> Genus</label>
                  <label><input type="checkbox" id="rankFilter-genushybrid" name="rank" value="genushybrid"> Genushybrid</label>
                  <label><input type="checkbox" id="rankFilter-species" name="rank" value="species"> Species</label>
                  <label><input type="checkbox" id="rankFilter-hybrid" name="rank" value="hybrid"> Hybrid</label>
                  <label><input type="checkbox" id="rankFilter-subspecies" name="rank" value="subspecies"> Subspecies</label>
                  <label><input type="checkbox" id="rankFilter-variety" name="rank" value="variety"> Variety</label>
                  <label><input type="checkbox" id="rankFilter-form" name="rank" value="form"> Form</label>
                </div>
              </div>
              <div>
                <label for="taxonNameInput" data-tooltip="Taxon must have a scientific or common name matching this string. Comma-separate for multiple.">Taxon Name:</label>
                <input type="text" id="taxonNameInput" placeholder="e.g. Quercus, oak">
              </div>
              <div>
                <label data-tooltip="Taxon must have one of these IUCN conservation statuses. Combine with a Place to scope it regionally.">IUCN Status:</label>
                <div id="csiFilter" class="checkbox-grid">
                  <label><input type="checkbox" id="csiFilter-LC" name="csi" value="LC"> Least Concern</label>
                  <label><input type="checkbox" id="csiFilter-NT" name="csi" value="NT"> Near Threatened</label>
                  <label><input type="checkbox" id="csiFilter-VU" name="csi" value="VU"> Vulnerable</label>
                  <label><input type="checkbox" id="csiFilter-EN" name="csi" value="EN"> Endangered</label>
                  <label><input type="checkbox" id="csiFilter-CR" name="csi" value="CR"> Critically Endangered</label>
                  <label><input type="checkbox" id="csiFilter-EW" name="csi" value="EW"> Extinct in the Wild</label>
                  <label><input type="checkbox" id="csiFilter-EX" name="csi" value="EX"> Extinct</label>
                </div>
              </div>
              <div>
                <label for="csInput" data-tooltip="Taxon must have this conservation status code. Codes are authority-specific and case-insensitive; EN, VU, CR and NT are widely populated. Combine with a Place to scope it regionally.">Conservation Status Code:</label>
                <input type="text" id="csInput" placeholder="e.g. EN">
              </div>
              <div>
                <label for="csaInput" data-tooltip="Taxon must have a conservation status from this authority, case-insensitive. Use the IUCN Status boxes above for IUCN itself; this is for other authorities such as natureserve.">Conservation Status Authority:</label>
                <input type="text" id="csaInput" placeholder="e.g. natureserve">
              </div>

              <p class="filter-subhead">Licensing &amp; Obscuration</p>
              <div>
                <label data-tooltip="License on the observation record itself, as opposed to the photo and sound licenses above.">Observation License:</label>
                <div id="obsLicenses" class="checkbox-grid">
                  <label><input type="checkbox" id="obsLicenses-cc0" name="license" value="cc0"> CC0</label>
                  <label><input type="checkbox" id="obsLicenses-cc-by" name="license" value="cc-by"> CC-BY</label>
                  <label><input type="checkbox" id="obsLicenses-cc-by-sa" name="license" value="cc-by-sa"> CC-BY-SA</label>
                  <label><input type="checkbox" id="obsLicenses-cc-by-nc" name="license" value="cc-by-nc"> CC-BY-NC</label>
                  <label><input type="checkbox" id="obsLicenses-cc-by-nd" name="license" value="cc-by-nd"> CC-BY-ND</label>
                  <label><input type="checkbox" id="obsLicenses-cc-by-nc-sa" name="license" value="cc-by-nc-sa"> CC-BY-NC-SA</label>
                  <label><input type="checkbox" id="obsLicenses-cc-by-nc-nd" name="license" value="cc-by-nc-nd"> CC-BY-NC-ND</label>
                </div>
              </div>
              <div>
                <label data-tooltip="Matches the geoprivacy or taxon geoprivacy on the observation.">Obscuration:</label>
                <div id="obscurationFilter" class="checkbox-grid">
                  <label><input type="checkbox" id="obscurationFilter-obscured" name="obscuration" value="obscured"> Obscured</label>
                  <label><input type="checkbox" id="obscurationFilter-private" name="obscuration" value="private"> Private</label>
                  <label><input type="checkbox" id="obscurationFilter-none" name="obscuration" value="none"> None</label>
                </div>
              </div>

              <p class="filter-subhead">Time of Day &amp; Calendar</p>
              <div>
                <label for="hourInput" data-tooltip="Observed within these hours (0-23). Comma-separate for multiple.">Hour of Day:</label>
                <input type="text" id="hourInput" placeholder="e.g. 6,7,8">
              </div>
              <div>
                <label for="dayInput" data-tooltip="Observed on these days of the month (1-31). Comma-separate for multiple.">Day of Month (observed):</label>
                <input type="text" id="dayInput" placeholder="e.g. 1,15">
              </div>
              <div>
                <label for="yearInput" data-tooltip="Observed in these years. Comma-separate for multiple. Note: the Date section year range emits d1/d2 instead, so setting both narrows to their overlap.">Year (observed):</label>
                <input type="text" id="yearInput" placeholder="e.g. 2023,2024">
              </div>
              <div>
                <label for="observedOnInput" data-tooltip="Must be observed on this exact date.">Observed On (exact date):</label>
                <input type="date" id="observedOnInput" placeholder="">
              </div>
              <div>
                <label for="createdDayInput" data-tooltip="Added on these days of the month (1-31). Comma-separate for multiple.">Day of Month (added):</label>
                <input type="text" id="createdDayInput" placeholder="e.g. 1,15">
              </div>
              <div>
                <label for="createdYearInput" data-tooltip="Added in these years. Comma-separate for multiple.">Year (added):</label>
                <input type="text" id="createdYearInput" placeholder="e.g. 2024">
              </div>
              <div>
                <label for="createdOnInput" data-tooltip="Must have been added to iNat on this exact date.">Added On (exact date):</label>
                <input type="date" id="createdOnInput" placeholder="">
              </div>
              <div>
                <label for="updatedSinceInput" data-tooltip="Must have been updated at or after this time (ISO 8601).">Updated Since:</label>
                <input type="text" id="updatedSinceInput" placeholder="e.g. 2024-01-01T00:00:00Z">
              </div>

              <p class="filter-subhead">People</p>
              <div>
                <label for="unobservedByUserInput" data-tooltip="Exclude taxa this user has already observed, i.e. the lifers-for-someone filter. Numeric user ID.">Unobserved By User ID:</label>
                <input type="number" id="unobservedByUserInput" placeholder="e.g. 12345">
              </div>
              <div>
                <label for="annotationUserInput" data-tooltip="Must have an annotation created by this user. Comma-separate for multiple IDs.">Annotation By User ID:</label>
                <input type="text" id="annotationUserInput" placeholder="e.g. 12345">
              </div>
              <div>
                <label for="userLoginInput" data-tooltip="Observer must have this login. Comma-separate for multiple.">User Login:</label>
                <input type="text" id="userLoginInput" placeholder="e.g. megachile">
              </div>
              <div>
                <label for="viewerIdInput" data-tooltip="User ID whose reviewed state the Reviewed filter applies to. Defaults to you.">Viewer ID:</label>
                <input type="number" id="viewerIdInput" placeholder="e.g. 12345">
              </div>

              <p class="filter-subhead">Record &amp; Site</p>
              <div>
                <label for="idAboveInput" data-tooltip="Observation ID must be greater than this value.">Observation ID Above:</label>
                <input type="number" id="idAboveInput" placeholder="">
              </div>
              <div>
                <label for="idBelowInput" data-tooltip="Observation ID must be less than this value.">Observation ID Below:</label>
                <input type="number" id="idBelowInput" placeholder="">
              </div>
              <div>
                <label for="notIdInput" data-tooltip="Must not have these observation IDs. Comma-separate for multiple.">Exclude Observation IDs:</label>
                <input type="text" id="notIdInput" placeholder="e.g. 12345,67890">
              </div>
              <div>
                <label for="siteIdInput" data-tooltip="Must be affiliated with the iNaturalist network site with this ID.">Site ID:</label>
                <input type="number" id="siteIdInput" placeholder="">
              </div>
              <div>
                <label for="accBelowOrUnknownInput" data-tooltip="Positional accuracy is below this value in meters, or is unknown.">Accuracy Below or Unknown (m):</label>
                <input type="number" id="accBelowOrUnknownInput" placeholder="">
              </div>
              <div>
                <label for="accuracyExperimentInput" data-tooltip="Must be included in this observation accuracy experiment.">Accuracy Experiment ID:</label>
                <input type="number" id="accuracyExperimentInput" placeholder="">
              </div>
              <div>
                <label for="ofvDatatypeSelect" data-tooltip="Must have an observation field value of this datatype.">Observation Field Datatype:</label>
                <select id="ofvDatatypeSelect">
                  <option value="">Any</option>
                  <option value="text">Text</option>
                  <option value="numeric">Numeric</option>
                  <option value="date">Date</option>
                  <option value="time">Time</option>
                  <option value="datetime">Datetime</option>
                  <option value="taxon">Taxon</option>
                  <option value="dna">Dna</option>
                  <option value="boolean">Boolean</option>
                </select>
              </div>
              <div>
                <label for="localeInput" data-tooltip="Locale preference for taxon common names in the results.">Locale:</label>
                <input type="text" id="localeInput" placeholder="e.g. en">
              </div>
              <div>
                <label for="preferredPlaceInput" data-tooltip="Place preference for regional taxon common names in the results.">Preferred Place ID:</label>
                <input type="number" id="preferredPlaceInput" placeholder="">
              </div>

            </fieldset>
          </div>

        <div class="collapsible-container">
            <button id="toggleFilters" class="collapse-toggle">Toggles ▼</button>
            <fieldset id="additionalFilters" class="collapsed">

              <div class="toggle-group">
                <label>Captive:</label>
                <input type="radio" id="captive-any" name="captive" value="any" checked>
                <label for="captive-any">Any</label>
                <input type="radio" id="captive-yes" name="captive" value="true">
                <label for="captive-yes">Yes</label>
                <input type="radio" id="captive-no" name="captive" value="false">
                <label for="captive-no">No</label>
              </div>

              <div class="toggle-group">
                <label>Has Sounds:</label>
                <input type="radio" id="sounds-any" name="sounds" value="any" checked>
                <label for="sounds-any">Any</label>
                <input type="radio" id="sounds-yes" name="sounds" value="true">
                <label for="sounds-yes">Yes</label>

          <button id="addObservationFieldButton" data-tooltip="Filter for observations with values for specific observation fields">Add Observation Field</button>
          <button id="addAnnotationButton" data-tooltip="Filter for observations with specific annotations">Add Annotation</button>
      </div>
      <label data-tooltip="If multiple ID Taxon criteria are added, match only observations with at least one identification for each specified taxon (includes descendants)"><input type="checkbox" id="idTaxonExclusive"> ID Taxa Exclusive</label>
      <label data-tooltip="iNaturalist Network sites (e.g. inaturalist.ala.org.au) default to their own region when no place is set. Tick this to add place_id=any so results stay global. Ignored if you add a specific Place filter."><input type="checkbox" id="allPlacesToggle"> All places (override site default)</label>
      <div id="actionsContainer">
      </div>
            
        <button id="generateUrlButton">Generate iNaturalist URL</button>
    </fieldset>

  <div id="urlOutputs">
      <div id="plainUrlOutput">
        <textarea id="plainUrlText" rows="3" spellcheck="false"></textarea>
        <button id="copyUrlButton" title="Copy to clipboard">📋</button>
      </div>
      <div id="buttonOutputs">
          <a id="identifyButton" target="_blank" class="url-button">Identify</a>
          <a id="exploreButton" target="_blank" class="url-button">Explore</a>
      </div>
  </div>

    <script src="shared_api.js"></script>
    <script src="URLgen.js"></script>
    <link rel="stylesheet" href="leaflet.css" />
    <script src="leaflet.js"></script>
</body>
</html>
